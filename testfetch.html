<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>fetch test</title>
<style>body{font-family:monospace;background:#111;color:#eee;font-size:20px;padding:24px;line-height:1.9}.ok{color:#4ade80}.bad{color:#f87171}</style></head>
<body>
<div id="log">TEST RUNNING...</div>
<script>
var log = document.getElementById('log');
var lines = [];
function add(t, cls){ lines.push('<span class="'+cls+'">'+t+'</span>'); log.innerHTML = lines.join('<br>'); }
var urls = [
 ['fastly', 'https://fastly.jsdelivr.net/gh/Chenhuyue/ios-mega-source@main/wallpapers.json'],
 ['cdn', 'https://cdn.jsdelivr.net/gh/Chenhuyue/ios-mega-source@main/wallpapers.json'],
 ['statically', 'https://cdn.statically.io/gh/Chenhuyue/ios-mega-source/main/wallpapers.json'],
 ['raw', 'https://raw.githubusercontent.com/Chenhuyue/ios-mega-source/main/wallpapers.json'],
 ['bingimg', 'https://cn.bing.com/th?id=OHR.EnchantedForest_EN-US1234567890_1920x1080.jpg']
];
var done = 0;
urls.forEach(function(pair){
  var name = pair[0], u = pair[1];
  var ctrl = new AbortController();
  var to = setTimeout(function(){ ctrl.abort(); }, 8000);
  fetch(u, {signal: ctrl.signal}).then(function(r){
    clearTimeout(to);
    add(name + ' FETCH OK status=' + r.status, 'ok');
  }).catch(function(e){
    clearTimeout(to);
    add(name + ' FETCH FAIL ' + (e && e.name ? e.name : e), 'bad');
  }).finally(function(){
    done++;
    if (done === urls.length) add('TEST COMPLETE', 'ok');
  });
});
</script>
</body></html>
